packages:
  - apps/*
  - packages/*

# Dependencies whose install scripts may run. Everything else is refused (strictDepBuilds).
allowBuilds:
  esbuild: true
  workerd: true

# One version of each shared tool. Pins are at least two weeks old (published by 2026-10-05),
# except vite 8.3.4: 8.3.0–8.3.2 carry three dev-server advisories fixed in 8.3.3 (GHSA-rq7h-c2jc-7f22,
# GHSA-vfpm-58rq-9qcg, GHSA-9jrq-w75r-8gcw).
catalog:
  '@sveltejs/adapter-cloudflare': 8.0.0
  '@sveltejs/kit': 3.0.0
  '@sveltejs/vite-plugin-svelte': 7.3.1
  '@types/node': 24.19.1
  esbuild: 0.28.2
  hono: 4.13.13
  standardwebhooks: 1.1.1
  svelte: 5.57.1
  svelte-check: 4.7.6
  torph: 0.1.3
  # TypeScript 7 is the native (Go) compiler: fast, but it ships no JavaScript API yet,
  # so it only checks the plain TypeScript packages.
  typescript: 7.0.2
  vite: 8.3.4
  vitest: 5.0.3
  wrangler: 4.147.0
  zod: 4.6.5

catalogs:
  # SvelteKit 3, svelte-check and editors need TypeScript 6's JavaScript API.
  ts6:
    typescript: 6.0.3
