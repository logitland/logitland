packages:
  - apps/*
  - packages/*

# Dependencies whose install scripts may run. Everything else is refused (strictDepBuilds).
allowBuilds:
  esbuild: true
  # effect's optional native msgpack speedup; the pure JS fallback is enough.
  msgpackr-extract: false
  workerd: true
  # Svartz's dependencies: sharp loads its prebuilt @img/sharp-* binary, and core-js's script only prints an ad.
  core-js: false
  sharp: false

# One version of each shared tool. Pins are at least two weeks old (published by 2026-10-05),
# except vite 8.3.4: 8.3.0–8.3.2 carry three dev-server advisories fixed in 8.3.3 (GHSA-rq7h-c2jc-7f22,
# GHSA-vfpm-58rq-9qcg, GHSA-9jrq-w75r-8gcw), and formsnap 2.1.0 (2026-10-20), the first release that accepts
# sveltekit-superforms 3, which SvelteKit 3 needs, and @mia-cx/discord-catalog 0.1.0 (2026-10-25), our own package's
# first release.
catalog:
  '@fontsource-variable/funnel-sans': 5.3.0
  '@internationalized/date': 3.12.4
  '@lucide/svelte': 1.52.0
  '@mdream/js': 1.7.2
  '@mia-cx/discord-catalog': 0.1.0
  '@shadcn-svelte/primitives': 0.0.1
  '@sveltejs/adapter-cloudflare': 8.0.0
  '@sveltejs/kit': 3.0.0
  '@sveltejs/vite-plugin-svelte': 7.3.1
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.19.1
  bits-ui: 2.19.5
  cn: 0.4.0
  discord-api-types: 0.38.51
  # @mia-cx/discord-catalog's peer, pinned exactly.
  effect: 4.0.0-beta.101
  embla-carousel-svelte: 8.6.0
  esbuild: 0.28.2
  formsnap: 2.1.0
  hono: 4.13.13
  layerchart: 2.5.1
  mode-watcher: 1.1.0
  paneforge: 1.0.2
  shadcn-svelte: 1.7.0
  shiki: 3.23.0
  standardwebhooks: 1.1.1
  svelte: 5.57.1
  svelte-check: 4.7.6
  svelte-sonner: 1.2.1
  sveltekit-superforms: 3.0.0
  tailwind-variants: 3.3.1
  tailwindcss: 4.3.3
  torph: 0.1.3
  tw-animate-css: 1.4.0
  # TypeScript 7 is the native (Go) compiler: fast, but it ships no JavaScript API yet,
  # so it only checks the plain TypeScript packages.
  typescript: 7.0.2
  vaul-svelte: 1.0.0-next.7
  vite: 8.3.4
  vitest: 5.0.3
  wrangler: 4.147.0
  zod: 4.6.5

catalogs:
  # SvelteKit 3, svelte-check and editors need TypeScript 6's JavaScript API.
  ts6:
    typescript: 6.0.3

# Newer than pnpm's minimum release age: formsnap (see the catalog note) and Svartz 2.0.0 (2026-10-27),
# the published version used by apps/docs, including minimal-based theme composition.
# @svartz/vite pins theme-minimal, so it installs too.
minimumReleaseAgeExclude:
  - formsnap@2.1.0
  - '@mia-cx/discord-catalog@0.1.0'

  - '@svartz/config@2.0.0'
  - '@svartz/core@2.0.0'
  - '@svartz/plugins@2.0.0'
  - '@svartz/theme-api-docs@2.0.0'
  - '@svartz/theme-mcp-docs@2.0.0'
  - '@svartz/theme-minimal@2.0.0'
  - '@svartz/ui@2.0.0'
  - '@svartz/vite@2.0.0'
  - svartz@2.0.0
