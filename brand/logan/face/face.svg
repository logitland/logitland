<svg xmlns="http://www.w3.org/2000/svg" width="1804" height="1128" viewBox="0 0 1804 1128">
  <title>Logan — 2D face layers</title>
  <!-- Each eye is the cubic Laguz from brand/logo/04-laguz, mirrored: the arm is the brow.
       The pupils glance right and the right eye sits higher, after reference/logan.png. -->
  <rect id="background" width="1804" height="1128" fill="black"/>
  <!-- Outlined because render-textures.py's renderer ignores strokes:
       M 822 800 C 920 836 1046 806 1128 716, 34 wide with round caps. -->
  <g id="static">
    <path d="M 827.9 784 C 925.9 820 1033.4 794.5 1115.4 704.5 A 17 17 0 0 1 1140.6 727.5
             C 1058.6 817.5 914.1 852 816.1 816 A 17 17 0 0 1 827.9 784 Z" fill="#ff55dd"/>
  </g>
  <!-- The rig's blinks squash each eye toward the centre of its first rect. -->
  <!-- Stem width W = 150: the flat top runs 0.4W past the stem, the arm drops at 45°
       to 1.4W out and is cut square, 1.4W tall. The arm overlaps the stem to avoid a seam. -->
  <g id="eye-R" fill="#ff55dd">
    <rect x="537" y="300" width="150" height="440"/>
    <path d="M 577 300 H 477 L 327 450 V 660 L 537 450 H 577 Z"/>
    <rect x="573" y="324" width="90" height="90" fill="black"/>
  </g>
  <g id="eye-L" fill="#ff55dd">
    <rect x="1372" y="232" width="150" height="440"/>
    <path d="M 1412 232 H 1312 L 1162 382 V 592 L 1372 382 H 1412 Z"/>
    <rect x="1408" y="256" width="90" height="90" fill="black"/>
  </g>
</svg>
